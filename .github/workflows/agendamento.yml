name: Robô Diário de SEO

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (06:00 BRT)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar o script manualmente clicando num botão no GitHub

jobs:
  executar_postagem:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar o motor de automação (robo_diario.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # O conteúdo do JSON de credenciais do Google pode ser colado como um secret em texto
          GSC_CREDENTIALS_JSON_CONTENT: ${{ secrets.GSC_CREDENTIALS_JSON_CONTENT }}
        run: |
          # Cria temporariamente o arquivo JSON a partir do secret para a biblioteca do Google ler
          echo "$GSC_CREDENTIALS_JSON_CONTENT" > gsc_credentials.json
          # Aponta a variável de ambiente para o arquivo criado
          export GSC_CREDENTIALS_JSON="gsc_credentials.json"
          
          # Roda o script de geração diária
          python robo_diario.py
